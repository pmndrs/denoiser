name: Release (npm publish)

# Manual, deliberate trigger: publishing IS the launch (it also retires the
# TFJS 0.x line as `latest`). Run from the Actions tab.
#
# Auth is npm trusted publishing (OIDC), no NPM_TOKEN secret. One-time setup
# by a `denoiser` package owner on npmjs.com:
#   package -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization: pmndrs   Repository: denoiser
#     Workflow filename: release.yml   Environment: (blank)
#
# Trusted publishing needs `id-token: write` and npm >= 11.5.1 (node 24 ships
# npm 11). Provenance is attached automatically.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Corepack before setup-node: `cache: yarn` shells out to yarn, and the
      # packageManager field pins yarn 4 (see ci.yml).
      - name: Enable Corepack (yarn 4)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: yarn install --immutable
      # Builds @pmndrs/denoiser-core + -ort first; the `denoiser` preset bundles
      # them (JS + types), so only `denoiser` itself is published.
      - name: Build
        run: yarn workspaces foreach -R --topological-dev --from denoiser run build
      - name: Typecheck
        run: yarn workspace denoiser exec tsc --noEmit
      - name: Show what will publish
        run: cd packages/denoiser && npm pack --dry-run
      # Ensure the npm CLI supports trusted publishing even if the runner's
      # bundled npm drifts.
      - name: npm >= 11.5.1
        run: npm install -g npm@^11.5.1 && npm --version
      # npm (not yarn): the OIDC token exchange is done by the npm CLI.
      - name: Publish
        run: cd packages/denoiser && npm publish --provenance --access public --tag "${{ inputs.tag }}"
