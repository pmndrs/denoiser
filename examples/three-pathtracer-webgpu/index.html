<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU path tracer + denoiser (shared device)</title>
    <style>
      .row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
      figure { margin: 0; max-width: 100%; }
      figcaption { color: var(--dn-muted); font-size: 0.82rem; }
      canvas { display: block; }
      #out { width: 512px; height: 512px; max-width: 100%; height: auto; aspect-ratio: 1; border: 1px solid var(--dn-border); border-radius: 10px; }
      /* before/after compare: noisy path-traced base, denoised overlay clipped by the slider */
      #compare { position: relative; width: 512px; max-width: 100%; aspect-ratio: 1; border: 1px solid var(--dn-border); container-type: inline-size; }
      #compare canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
      #revealWrap { position: absolute; top: 0; left: 0; height: 100%; width: 50%; overflow: hidden;
                    border-right: 2px solid #fffa; pointer-events: none; }
      /* the overlay stays full-size (100cqw = #compare's width) while the wrapper clips it */
      #revealWrap canvas { pointer-events: none; width: 100cqw; height: 100cqw; } /* orbit-drag falls through to #view */
      #outGpu { transition: opacity 0.15s ease; } /* fade stale denoise out during orbit */
      #reveal { position: absolute; left: 0; bottom: -30px; width: 100%; accent-color: var(--dn-accent); }
      .lbl { position: absolute; top: 6px; font-size: 11px; background: #0008; padding: 2px 6px;
             border-radius: 3px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="dn-page">
    <header class="dn-head">
      <h1>three r186 WebGPUPathTracer &rarr; WebGPU denoiser (one GPUDevice)</h1>
      <p class="dn-lede">
        Orbit with the mouse — the path tracer accumulates samples while the WebGPU
        denoiser cleans up the noise live, on the same GPU device. Drag the slider to compare
        denoised vs. raw accumulation.
      </p>
    </header>
    <section class="dn-panel" aria-label="controls">
      <!-- denoiser runtime picker (examples/_shared/chrome.ts runtimePicker; reloads with ?runtime=) -->
      <div id="runtimePicker"></div>
      <div class="dn-break"></div>
      <div class="dn-group">
        <span class="dn-label">Path tracer</span>
        <div class="dn-row">
          <label class="dn-check">max samples <input id="maxSamples" type="number" value="6" min="1" max="500"></label>
          <label class="dn-check">settle <input id="settle" type="number" value="0" min="0" max="2000" step="50"> <span class="dn-unit">ms</span></label>
          <label class="dn-check">fade <input id="fade" type="number" value="0" min="0" max="1000" step="50"> <span class="dn-unit">ms</span></label>
        </div>
      </div>
      <div class="dn-group">
        <label class="dn-label" for="quality">Quality</label>
        <select id="quality"><option value="fast" selected>fast (small)</option><option value="balanced">balanced</option></select>
      </div>
      <div class="dn-group">
        <span class="dn-label">Denoise</span>
        <label class="dn-check"><input id="live" type="checkbox" disabled><span>live denoise (progressive, zero-copy → render target)</span></label>
        <label class="dn-check"><input id="aux" type="checkbox" checked><span>G-buffer aux (albedo+normal MRT → 9ch model)</span></label>
        <label class="dn-check"><input id="fsr" type="checkbox"><span>FSR1 upscale, @pmndrs/upscaler (render 50% → denoise → EASU/RCAS)</span></label>
      </div>
      <div class="dn-group">
        <span class="dn-label">One-shot</span>
        <div class="dn-row">
          <button class="dn-btn" id="denoise" disabled>Denoise (CPU readback path)</button>
          <button class="dn-btn" id="denoiseGpu" disabled>Denoise (zero-copy GPU path)</button>
        </div>
      </div>
    </section>
    <div class="row">
      <figure style="margin-bottom: 3rem;">
        <div id="compare">
          <canvas id="view" width="512" height="512"></canvas>
          <div id="revealWrap"><canvas id="outGpu" width="512" height="512"></canvas></div>
          <span class="lbl" style="left: 6px;">denoised</span>
          <span class="lbl" style="right: 6px;">path traced</span>
          <input id="reveal" type="range" min="0" max="100" value="50">
        </div>
        <figcaption style="margin-top: 2.2rem;">drag the slider — denoised (left) vs raw accumulation (right); orbit with the mouse</figcaption>
      </figure>
      <figure><canvas id="out" width="512" height="512"></canvas><figcaption>denoised — CPU path button (LDR input)</figcaption></figure>
    </div>
    <pre id="status" class="dn-status"></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
