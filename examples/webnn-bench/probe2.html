<!doctype html><html><head><meta charset="UTF-8"><title>WebNN export probe</title></head><body><pre id="status"></pre><script type="module">
// createExportableTensor: which dtypes / argument orders / shapes Chrome accepts
const st = document.querySelector('#status');
const log = (m) => { st.textContent += m + '\n'; };
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice({ requiredFeatures: adapter.features.has('shader-f16') ? ['shader-f16'] : [] });
let ctx;
const tries = [
  ['f32', { dataType: 'float32', shape: [1, 2, 2, 2] }],
  ['int32', { dataType: 'int32', shape: [1, 2, 2, 2] }],
  ['f16 [1,2,2,2]', { dataType: 'float16', shape: [1, 2, 2, 2] }],
];
for (const s of [[1, 3, 1088, 1920], [1, 9, 1088, 1920], [8, 3, 256, 256], [8, 9, 256, 256], [4, 9, 256, 256], [1, 9, 2048, 1024],
  [1, 1, 16384, 16], [1, 1, 16385, 16], [1, 1, 32768, 16], [1, 1, 16, 16384], [1, 1, 16, 32768], [1, 64, 16384, 1], [1, 1, 8192, 4096]]) {
  tries.push([`f16 [${s}]`, { dataType: 'float16', shape: s }]);
}
for (const [n, d] of tries) {
  ctx = await navigator.ml.createContext({ deviceType: 'gpu' });
  try {
    const t = await ctx.createExportableTensor(d, device);
    const b = await ctx.exportToGPU(t);
    log(`ok   ${n} (${b.size} B, usage 0x${b.usage.toString(16)})`);
    b.destroy(); t.destroy();
  } catch (e) { log(`FAIL ${n}: ${e.message}`); }
  ctx.destroy();
}
window.__result = { ready: true };
</script></body></html>
