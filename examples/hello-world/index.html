<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>denoiser — hello world</title>
    <style>
      .dn-page { max-width: 980px; }
      .row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 1.5rem 0; }
      figure { margin: 0; }
      figcaption { color: var(--dn-muted); font-size: 0.85rem; margin-top: 0.4rem; }
      canvas { display: block; border: 1px solid var(--dn-border); border-radius: 8px; image-rendering: pixelated; width: 400px; max-width: 100%; height: auto; }
      #status { color: var(--dn-muted); font-size: 0.9rem; min-height: 1.2em; }
      pre {
        background: var(--dn-inset);
        border: 1px solid var(--dn-border);
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="dn-page">
    <header class="dn-head">
      <h1><span class="name">denoiser</span> — hello world</h1>
      <p class="dn-lede">
        A noisy path-traced render, denoised entirely in the browser over WebGPU.
        No three.js, no build tricks — the code below is the whole story.
      </p>
    </header>

    <div class="row">
      <figure>
        <canvas id="noisy" width="512" height="512"></canvas>
        <figcaption>noisy — 512×512, 4 samples/pixel (raw path tracer output)</figcaption>
      </figure>
      <figure>
        <canvas id="denoised" width="512" height="512"></canvas>
        <figcaption>denoised — Denoiser.create() → denoise()</figcaption>
      </figure>
    </div>

    <p id="status"></p>

    <h2>The whole thing</h2>
    <pre><code id="snippet"></code></pre>

    <!-- Hidden source image: this is the actual element passed to denoiser.denoise().
         Relative src (not "/noisy.png") so it resolves under the deployed subpath. -->
    <img id="noisy-img" src="./noisy.png" alt="" style="display: none" />

    <!-- Footer is injected by the shared demo chrome (demoFooter). -->
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
